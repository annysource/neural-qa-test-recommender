name: QA test case recommendations

on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

# Permissões declaradas explicitamente para o GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  recommend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Recommend test cases
        run: npm run recommend:pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}