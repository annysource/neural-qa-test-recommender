<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Test Case Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container-xxl py-4">
        <h1>QA Test Case Recommender</h1>
        <p class="lead">Recomendação de casos de teste para Pull Requests de jogos Unity.</p>

        <section class="card mb-4" aria-labelledby="context-heading">
            <div class="card-body">
                <h2 id="context-heading" class="h4">Contexto da alteração</h2>
                <p>Informe os metadados do PR. No GitHub, estes campos são preenchidos automaticamente pelo workflow.</p>
                <form id="prContextForm">
                    <div class="mb-3">
                        <label class="form-label" for="branch">Branch</label>
                        <input class="form-control" id="branch" name="branch" placeholder="feature/inventory-selection">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="title">Título do Pull Request</label>
                        <input class="form-control" id="title" name="title" placeholder="Keep selected inventory item in sync">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="description">Descrição</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="commitMessages">Mensagens dos commits (uma por linha)</label>
                        <textarea class="form-control" id="commitMessages" name="commitMessages" rows="3"></textarea>
                    </div>
                    <button class="btn btn-success" id="runRecommendationBtn" type="submit" disabled>Gerar checklist</button>
                </form>
                <button class="btn btn-outline-primary mt-3" id="trainModelBtn" type="button">Treinar novamente</button>
                <p class="mt-3 mb-0" id="status" role="status" aria-live="polite">Carregando modelo…</p>
            </div>
        </section>

        <section aria-labelledby="recommendations-heading">
            <h2 id="recommendations-heading" class="h4">Checklist recomendado para QA</h2>
            <div id="recommendations"></div>
        </section>
    </main>
    <script type="module" src="./src/index.js"></script>
</body>
</html>
